# Synthetic, isolated validation fixture. No real subscription, credentials,
# system proxy, TUN or exposed REST API. NEVER activate this config.
mixed-port: 0
mode: rule
log-level: warning
allow-lan: false
ipv6: false
external-controller: ''
tun:
  enable: false
proxies:
  - name: Lab-A
    type: http
    server: 127.0.0.1
    port: 65530
  - name: Lab-B
    type: http
    server: 127.0.0.1
    port: 65531
proxy-groups:
  - name: OpenAI-Recovery-Lab
    type: fallback
    proxies:
      - Lab-A
      - Lab-B
    url: https://chatgpt.com/cdn-cgi/trace
    interval: 60
    timeout: 5000
rules:
  - DOMAIN-SUFFIX,chatgpt.com,OpenAI-Recovery-Lab
  - DOMAIN-SUFFIX,openai.com,OpenAI-Recovery-Lab
  - DOMAIN-SUFFIX,oaistatsig.com,OpenAI-Recovery-Lab
  - DOMAIN-SUFFIX,openaimerge.com,OpenAI-Recovery-Lab
  - MATCH,DIRECT
