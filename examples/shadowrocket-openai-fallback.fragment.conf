# TunnelSentinel | Shadowrocket OpenAI fallback DRAFT (not a standalone profile)
# DO NOT import this fragment as a whole replacement for your live configuration.
# Replace JP-Primary and US-Backup-X with exact subscribed node names,
# or create the group in Shadowrocket's official group editor.
# This file contains no subscriptions, keys, server IPs or credentials.
#
# Copy the group entry into the existing [Proxy Group] section only.
[Proxy Group]
OpenAI-Resilience = fallback,JP-Primary,US-Backup-1,US-Backup-2,interval=120,timeout=5,url=https://chatgpt.com/cdn-cgi/trace

# Copy these rules ABOVE any broader matching rules in the existing [Rule].
# Retain all other current rules and FINAL policy unchanged.
[Rule]
DOMAIN-SUFFIX,chatgpt.com,OpenAI-Resilience
DOMAIN-SUFFIX,openai.com,OpenAI-Resilience
DOMAIN-SUFFIX,oaistatic.com,OpenAI-Resilience
DOMAIN-SUFFIX,oaiusercontent.com,OpenAI-Resilience
DOMAIN-SUFFIX,oaistatsig.com,OpenAI-Resilience
DOMAIN-SUFFIX,openaimerge.com,OpenAI-Resilience
